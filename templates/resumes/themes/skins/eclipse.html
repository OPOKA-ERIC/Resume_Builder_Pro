{% extends "resumes/themes/archetypes/archetype_c.html" %}

{% block extra_css %}
<style>
  .archetype-c .header {
    text-align: center;
    border-bottom: none;
    padding-bottom: 16px;
  }
  .archetype-c .header h1 {
    font-weight: 300;
    color: #374151;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .archetype-c .section-title {
    border-bottom: none;
    color: #6b7280;
    font-size: 9pt;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
    position: relative;
  }
  .archetype-c .section-title::before,
  .archetype-c .section-title::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30%;
    height: 1px;
    background: #d1d5db;
  }
  .archetype-c .section-title::before { left: 0; }
  .archetype-c .section-title::after { right: 0; }
  .archetype-c .skill-item {
    background: transparent;
    color: #6b7280;
    border: 1px solid #e5e7eb;
    border-radius: 0;
    font-size: 9pt;
  }
</style>
{% endblock %}

{% block header_align %}center{% endblock %}
{% block contact_align %}center{% endblock %}
