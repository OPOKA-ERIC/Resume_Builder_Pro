{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ resume.title|default:"Resume" }} - {{ user.get_full_name|default:user.username }}</title>
  <link rel="stylesheet" href="{% static 'css/themes/themes.css' %}">
  {% block extra_css %}{% endblock %}
  <style>
    @page {
      size: A4;
      margin: {% block page_margin %}15mm 18mm{% endblock %};
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family, 'Inter', 'Segoe UI', Arial, sans-serif);
      font-size: 10pt;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--surface);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .resume-theme {
      color: var(--text-primary);
      background: var(--surface);
    }

    h1 { font-size: 22pt; font-weight: 700; color: var(--text-primary); }
    h2 { font-size: 13pt; font-weight: 600; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px; }
    h3 { font-size: 11pt; font-weight: 600; color: var(--text-primary); }
    h4 { font-size: 10pt; font-weight: 600; color: var(--text-secondary); }

    a { color: var(--accent); text-decoration: none; }

    .section { margin-bottom: 12px; }
    .section-title {
      font-size: 11pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .entry { margin-bottom: 10px; }
    .entry-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
    .entry-title { font-weight: 600; color: var(--text-primary); }
    .entry-date { font-size: 9pt; color: var(--text-secondary); white-space: nowrap; }
    .entry-subtitle { font-size: 9.5pt; color: var(--text-secondary); font-style: italic; }
    .entry-location { font-size: 9pt; color: var(--text-secondary); }

    .entry-description {
      margin-top: 4px;
      font-size: 9.5pt;
      color: var(--text-primary);
      line-height: 1.45;
    }

    .entry-description ul {
      padding-left: 16px;
      margin-top: 2px;
    }

    .entry-description li {
      margin-bottom: 2px;
      line-height: 1.4;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      list-style: none;
      padding: 0;
    }

    .skill-item {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 9pt;
      font-weight: 500;
    }

    .language-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
      padding: 0;
    }

    .language-item {
      font-size: 9.5pt;
      color: var(--text-primary);
    }

    .language-item .level {
      color: var(--text-secondary);
      font-size: 9pt;
    }

    .contact-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 9pt;
      color: var(--text-secondary);
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .reference-item {
      font-size: 9.5pt;
    }

    .reference-name { font-weight: 600; }
    .reference-relationship { font-style: italic; color: var(--text-secondary); font-size: 9pt; }
    .reference-contact { font-size: 9pt; color: var(--text-secondary); }

    .certification-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
      font-size: 9.5pt;
    }

    .cert-title { font-weight: 500; }
    .cert-issuer { color: var(--text-secondary); font-style: italic; }
    .cert-year { color: var(--text-secondary); font-size: 9pt; }

    .project-link {
      font-size: 9pt;
      color: var(--accent);
    }

    .empty-state {
      color: var(--text-secondary);
      font-style: italic;
      font-size: 9.5pt;
      padding: 8px 0;
    }

    .monochrome .skill-item {
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    @media print {
      body { background: white; }
      .resume-theme { min-height: auto; }
      .section { break-inside: avoid; }
      .entry { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="resume-theme {% if monochrome %}monochrome{% endif %}" style="
    --accent: {{ accent|default:'#1d4ed8' }};
    --accent-soft: {{ accent_soft|default:'#dbeafe' }};
    --text-primary: {{ text_primary|default:'#111827' }};
    --text-secondary: {{ text_secondary|default:'#4b5563' }};
    --surface: {{ surface|default:'#ffffff' }};
    --surface-alt: {{ surface_alt|default:'#f3f4f6' }};
    --border: {{ border|default:'#e5e7eb' }};
    --font-family: {{ font_family|default:"'Inter', 'Segoe UI', Arial, sans-serif" }};
  ">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
