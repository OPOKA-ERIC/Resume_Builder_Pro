<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ resume.title }} &mdash; {{ resume.user.get_full_name|default:resume.user.username }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0f172a;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toolbar-left .name {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .toolbar-left .title-sep {
            color: #475569;
            font-size: 0.85rem;
        }
        .toolbar-left .doc-title {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99,102,241,0.4);
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.08);
            color: #cbd5e1;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .cv-container {
            max-width: 900px;
            margin: 32px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .cv-frame {
            width: 100%;
            min-height: 1100px;
            border: none;
            padding: 40px;
        }
        .no-template {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
        }
        .no-template i { font-size: 3rem; margin-bottom: 16px; display: block; }
        .no-template p { font-size: 1.1rem; }
        @media (max-width: 768px) {
            .toolbar { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
            .toolbar-left .title-sep,
            .toolbar-left .doc-title { display: none; }
            .cv-container { margin: 16px; border-radius: 8px; }
            .cv-frame { padding: 20px; }
        }
        @media print {
            .toolbar { display: none; }
            .cv-container { box-shadow: none; margin: 0; border-radius: 0; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-left">
        <span class="name">{{ resume.user.get_full_name|default:resume.user.username }}</span>
        <span class="title-sep">|</span>
        <span class="doc-title">{{ resume.title }}</span>
    </div>
    <div class="toolbar-right">
        <a href="javascript:history.back()" class="btn-back"><i class="bi bi-arrow-left"></i> Back</a>
        <a href="{% url 'pdf_export:download_pdf' resume.id %}" class="btn-download"><i class="bi bi-download"></i> Download PDF</a>
    </div>
</div>

<div class="cv-container">
    {% if pdf_html %}
        <div class="cv-frame">{{ pdf_html|safe }}</div>
    {% else %}
        <div class="no-template">
            <i class="bi bi-file-earmark-text"></i>
            <p>No template selected for this resume.</p>
        </div>
    {% endif %}
</div>

</body>
</html>
