{% extends "base.html" %}
{% block title %}Create Portfolio{% endblock %}

{% block content %}
<div class="animate-fade-in-up" style="max-width: 600px; margin: 0 auto;">
    <div class="card border-0 shadow-sm" style="border-radius: var(--radius-md);">
        <div class="card-body text-center py-5">
            <i class="bi bi-share" style="font-size: 3rem; color: var(--primary);"></i>
            <h4 class="mt-3">Create a Shareable Portfolio</h4>
            <p class="text-muted">
                Generate a public portfolio page for <strong>"{{ resume.title }}"</strong>.
                You'll get a unique link and QR code to share with anyone.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-share me-1"></i> Generate Portfolio
                    </button>
                    <a href="{% url 'resumes:resume_preview' resume.id %}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-x me-1"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
